name: Initializing the application

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  exercise-1:
    name: Exercise 1 - Initializing the application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part10-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: part10-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check the application
        run: npx tsc --noEmit

      - name: Verify the application initializes (bundle the app)
        run: npx expo export --platform web