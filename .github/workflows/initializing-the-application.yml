name: Initializing the application

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  exercise-1:
    name: Exercise 1 - Initializing the application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rate-repository-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rate-repository-app/package-lock.json

      - name: Install dependencies
        # Use `npm install` (not `npm ci`): the app depends on platform-specific
        # optional packages (+@emnapi/runtime), so the committed lockfile (generated
        # on a local machine) must be reconciled for the runner's OS.
        run: npm install --no-audit --no-fund

      - name: Verify the application initializes (bundle the app)
        run: npx expo export --platform web