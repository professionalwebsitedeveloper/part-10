name: "Exercise 16: Sign out"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  exercise-16:
    name: Exercise 16 - Sign out
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rate-repository-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rate-repository-app/package-lock.json

      - name: Install dependencies
        # Use `npm install` (not `npm ci`): the app depends on platform-specific
        # optional packages (+@emnapi/runtime), so the committed lockfile (generated
        # on a local machine) must be reconciled for the runner's OS before linting.
        run: npm install --no-audit --no-fund

      - name: Check the me query is defined
        run: |
          grep -q "ME = gql" src/graphql/queries.js
          grep -q "me {" src/graphql/queries.js

      - name: Check the useMe hook is set up
        run: |
          test -f src/hooks/useMe.js
          grep -q "useQuery" src/hooks/useMe.js
          grep -q "ME" src/hooks/useMe.js

      - name: Check the AppBar renders Sign in and Sign out tabs
        run: |
          grep -q "useMe" src/components/AppBar.jsx
          grep -q "Sign in" src/components/AppBar.jsx
          grep -q "Sign out" src/components/AppBar.jsx

      - name: Check signing out removes the token before resetting the store
        run: |
          grep -q "removeAccessToken" src/components/AppBar.jsx
          grep -q "resetStore" src/components/AppBar.jsx
          grep -q "useAuthStorage" src/components/AppBar.jsx
          grep -q "useApolloClient" src/components/AppBar.jsx

      - name: Run linter checks
        run: npm run lint

      - name: Verify the application builds
        run: npx expo export --platform web