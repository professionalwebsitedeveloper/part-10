name: "Exercise: 5 Polished reviewed repositories list"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  exercise-5:
    name: Exercise 5 - Polished reviewed repositories list
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rate-repository-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rate-repository-app/package-lock.json

      - name: Install dependencies
        # Use `npm install` (not `npm ci`): the app depends on platform-specific
        # optional packages (+@emnapi/runtime), so the committed lockfile (generated
        # on a local machine) must be reconciled for the runner's OS before linting.
        run: npm install --no-audit --no-fund

      - name: Check the polished list components exist
        run: |
          test -f src/components/Text.jsx
          test -f src/components/Statistic.jsx
          test -f src/components/RepositoryItem.jsx
          test -f src/components/Main.jsx

      - name: Check the repository author avatar is displayed
        run: |
          grep -q "Image" src/components/RepositoryItem.jsx
          grep -q "ownerAvatarUrl" src/components/RepositoryItem.jsx

      - name: Check counts are shown in thousands with a single decimal and "k" suffix
        run: |
          grep -q "formatNumber" src/components/RepositoryItem.jsx
          grep -q "1000" src/components/RepositoryItem.jsx
          grep -q "toFixed" src/components/RepositoryItem.jsx
          grep -q "stargazersCount" src/components/RepositoryItem.jsx
          grep -q "forksCount" src/components/RepositoryItem.jsx

      - name: Check the polished colors and the split components are used
        run: |
          grep -q "backgroundColor: '#ffffff'" src/components/RepositoryItem.jsx
          grep -q "theme.colors.primary" src/components/RepositoryItem.jsx
          grep -q "backgroundColor: '#e1e4e8'" src/components/Main.jsx
          grep -q "Statistic" src/components/RepositoryItem.jsx
          grep -q "Text" src/components/RepositoryItem.jsx

      - name: Run linter checks
        run: npm run lint

      - name: Verify the application builds
        run: npx expo export --platform web
