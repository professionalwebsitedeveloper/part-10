name: "Exercise 9: Validating the sign-in form"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  exercise-9:
    name: Exercise 9 - Validating the sign-in form
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rate-repository-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rate-repository-app/package-lock.json

      - name: Install dependencies
        # Use `npm install` (not `npm ci`): the app depends on platform-specific
        # optional packages (+@emnapi/runtime), so the committed lockfile (generated
        # on a local machine) must be reconciled for the runner's OS before linting.
        run: npm install --no-audit --no-fund

      - name: Check Yup and the validation schema are set up
        run: |
          grep -q "yup" package.json
          grep -q "import \* as yup" src/components/SignIn.jsx
          grep -q "validationSchema" src/components/SignIn.jsx
          grep -q "yup.string().required" src/components/SignIn.jsx

      - name: Check touched fields with errors are indicated
        run: |
          grep -q "handleBlur" src/components/SignIn.jsx
          grep -q "formik.touched" src/components/SignIn.jsx
          grep -q "formik.errors" src/components/SignIn.jsx
          grep -q "inputError" src/components/SignIn.jsx

      - name: Check the error color is applied
        run: |
          grep -q "#d73a4a" src/theme.js
          grep -q "color === 'red'" src/components/Text.jsx
          grep -q '"red"' src/components/SignIn.jsx

      - name: Run linter checks
        run: npm run lint

      - name: Verify the application builds
        run: npx expo export --platform web