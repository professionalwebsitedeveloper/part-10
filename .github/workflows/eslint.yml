name: ESLint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  exercise-2:
    name: Exercise 2 - Setting up the ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rate-repository-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rate-repository-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter checks
        run: npm run lint