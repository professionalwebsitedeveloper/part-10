name: "Exercise 8: The sign-in form"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  exercise-8:
    name: Exercise 8 - The sign-in form
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rate-repository-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rate-repository-app/package-lock.json

      - name: Install dependencies
        # Use `npm install` (not `npm ci`): the app depends on platform-specific
        # optional packages (+@emnapi/runtime), so the committed lockfile (generated
        # on a local machine) must be reconciled for the runner's OS before linting.
        run: npm install --no-audit --no-fund

      - name: Check Formik is installed and used
        run: |
          grep -q "formik" package.json
          grep -q "useFormik" src/components/SignIn.jsx

      - name: Check the sign-in form has fields, a submit button and a submit handler
        run: |
          grep -q "TextInput" src/components/SignIn.jsx
          grep -q "placeholder=\"Username\"" src/components/SignIn.jsx
          grep -q "placeholder=\"Password\"" src/components/SignIn.jsx
          grep -q "secureTextEntry" src/components/SignIn.jsx
          grep -q "Pressable" src/components/SignIn.jsx
          grep -q "handleSubmit" src/components/SignIn.jsx

      - name: Check form values are logged on submit
        run: |
          grep -q "console.log" src/components/SignIn.jsx

      - name: Run linter checks
        run: npm run lint

      - name: Verify the application builds
        run: npx expo export --platform web